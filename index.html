<style>
  :root { --accent: #2F6C68; --ink: #1f2a33; --soft: #5b6670; --line: #e6e1d6; --bg: #fffdf8; }

  a { color: var(--accent); }
  footer { margin-top: 48px; color: var(--soft); font-size: .9rem; border-top: 1px solid var(--line); padding-top: 14px; }
  ul.apps { list-style: none; padding: 0; } ul.apps li { margin: 10px 0; }
